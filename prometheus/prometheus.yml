global:
  #how often it pulls from every target. 15s is fine enough for the graphs to
  #look smooth but not so often that 30 days of history gets huge
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

#rule_files says what to check, this says who to tell when a rule fires
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  #prometheus scraping itself. costs nothing and it makes debugging obvious,
  #if this one is up but node-exporter is down then i know which one broke
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node-exporter
    static_configs:
    #localhost because everything shares the host network namespace, so theres
    #no bridge or gateway ip or dns name involved that could go wrong
    #no custom instance label here on purpose. this file cant read .env so any
    #hostname i put here would be wrong on everyone elses machine. the real
    #hostname is in the nodename label of node_uname_info if a panel needs it
    - targets: ['127.0.0.1:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['127.0.0.1:9338']
    #cadvisor exports ~1000 series even trimmed down, keep only what the dashboard
    #and alerts use. and drop docker's virtual interfaces, same as node exporter
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total|oom_events_total|start_time_seconds)
        action: keep
      - source_labels: [interface]
        regex: veth.*|br-.*|docker\d*|lo
        action: drop


