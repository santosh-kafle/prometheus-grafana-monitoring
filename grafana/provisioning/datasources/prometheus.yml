apiVersion: 1

#this runs before the datasource below gets created. i need it because grafana
#matches provisioned datasources by uid, so if one already exists under a
#different uid it errors with "data source not found" and refuses to boot.
#deleting by name first means i can re-apply this file onto any grafana db
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    #fixed uid because my dashboards point at it. if i leave this out grafana
    #makes a random one on first start, which would be different on every fresh
    #install and every panel would say datasource not found
    uid: prometheus
    type: prometheus
    #proxy means the grafana server does the querying, not my browser. has to be
    #this way since prometheus is bound to 127.0.0.1 only
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    #cant be edited in the ui because provisioning re-applies on every restart,
    #so any ui edit would just disappear later and confuse me
    editable: false
